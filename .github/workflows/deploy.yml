name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyBr0Gx4aeElS_6d3SF-6XVVKyw57kC8I5s' }}
          VITE_FIREBASE_AUTH_DOMAIN: "learn-at---manus.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "learn-at---manus"
          VITE_FIREBASE_STORAGE_BUCKET: "learn-at---manus.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "655436723643"
          VITE_FIREBASE_APP_ID: "1:655436723643:web:868c62cd300f16755d809e"
          VITE_FIREBASE_MEASUREMENT_ID: "G-JH40DQ8TNJ"
        run: pnpm build

      - name: Prepare SPA Routing and Disable Jekyll
        run: |
          cp dist/public/index.html dist/public/404.html
          touch dist/public/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

      - name: Deploy to GitHub Pages (Actions Source)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to gh-pages Branch (Branch Source Fallback)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/public
          branch: gh-pages
