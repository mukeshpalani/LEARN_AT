version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: knowledgepilot_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: knowledgepilot_postgres
    environment:
      POSTGRES_DB: knowledgepilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: knowledgepilot_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_MODE=remote
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://pilot:secretpassword@postgres:5432/knowledgepilot
      - ENABLE_WEB_RESEARCH=true
    depends_on:
      - qdrant
      - postgres
    volumes:
      - ./documents:/app/documents
      - ./generated_reports:/app/generated_reports
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledgepilot_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  qdrant_storage:
  postgres_data:
